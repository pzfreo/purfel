name: Slice

on:
  push:
    branches: [main]
  pull_request:

jobs:
  slice:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build models
        run: uv run --script cutter.py

      - uses: estampo/estampo/action@v0
        with:
          config: estampo.toml
