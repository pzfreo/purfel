[pipeline]
stages = ["load", "arrange", "plate", "slice", "pack"]

[plate]
size = [256, 256]          # Bambu P1S bed

[slicer]
engine  = "orca"
version = "2.3.1"
bed_type = "Textured PEI Plate"   # physical plate on P1S — do not omit

[slicer.orca]
printer   = "Bambu Lab P1S 0.4 nozzle"
process   = "0.20mm Strength @BBL X1C"
filaments = ["Bambu PETG-CF @BBL X1C 0.4 nozzle"]

[slicer.orca.overrides]
# Strength — high wall count + gyroid infill for isotropic strength
wall_loops            = "5"
sparse_infill_density = "40%"
sparse_infill_pattern = "gyroid"
top_shell_layers      = "6"
bottom_shell_layers   = "6"
# Dimensional accuracy — bearing bore and slot are press/sliding fits
xy_hole_compensation  = "0.1"
# PETG-CF: less cooling preserves interlayer bonding; slower outer wall improves bore roundness
fan_max_speed                    = "40"
close_fan_the_first_x_layers     = "3"
outer_wall_speed                 = "40"
# Brim — adhesion for small footprints (sleeve stem, washer)
brim_type  = "outer_only"
brim_width = "8"

# Bearing-housing parts: upright so code-CAD orientation is preserved.
# Estampo drops each part to z=0 automatically after any orient/rotate.

[[parts]]
file   = "out/plate.step"
orient = "upright"

[[parts]]
file   = "out/shoe.step"
orient = "upright"

[[parts]]
file   = "out/upper_sleeve.step"
orient = "upside-down"   # flange face on bed; stem prints as clean tower from stable base

[[parts]]
file   = "out/lower_sleeve.step"
orient = "upright"

[[parts]]
file   = "out/washer.step"
orient = "upright"

[pack]
command = "bambox repack {sliced_3mf}"
output  = "{sliced_3mf}"
docker  = true
